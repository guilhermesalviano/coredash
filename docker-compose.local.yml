services:
  coredash:
    build:
      context: ./coredash
      dockerfile: Dockerfile
    env_file:
      - ./coredash/.env
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - coredash-data:/data
    restart: unless-stopped
    init: true

volumes:
  coredash-data:
